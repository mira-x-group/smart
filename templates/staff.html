<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Staff - KEEP</title>
  <style>
    * { box-sizing: border-box; }
    body{
      margin:0;
      background:#ffffff;
      color:#111111;
      font-family: system-ui, -apple-system, "Noto Sans KR", Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Top bar */
    .top{
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #eaeaea;
      padding: 16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title{
      font-size:18px;
      font-weight:900;
      letter-spacing:-0.2px;
    }

    /* Layout */
    .wrap{
      max-width: 980px;
      margin: 16px auto 44px;
      padding: 0 16px;
    }

    /* Cards */
    .list{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card{
      border:1px solid #ededed;
      border-radius:16px;
      background:#fff;
      padding: 12px;
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .thumb{
      width: 76px;
      height: 76px;
      border-radius: 14px;
      border: 1px solid #ededed;
      background:#fafafa;
      overflow:hidden;
      flex: 0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:12px;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .col{
      flex: 1;
      min-width: 0;
    }
    .room{
      font-size:12px;
      color:#666;
      margin-bottom: 6px;
    }
    .name{
      font-size:16px;
      font-weight:900;
      line-height:1.2;
      word-break: keep-all;
    }
    .code{
      margin-top: 7px;
      font-size:12px;
      color:#666;
    }
    .code b{ color:#111; }

    .actions{
      flex: 0 0 auto;
      display:flex;
      align-items:center;
    }
    .confirm{
      border: 1px solid #111;
      background:#111;
      color:#fff;
      font-weight:900;
      padding: 11px 14px;
      border-radius: 12px;
      cursor:pointer;
      min-width: 84px;
    }
    .confirm:active{ transform: scale(.99); }
    .confirm:disabled{
      border-color:#e6e6e6;
      background:#f3f3f3;
      color:#888;
      cursor:default;
    }

    .empty{
      border:1px dashed #e3e3e3;
      border-radius:16px;
      padding: 18px;
      background:#fafafa;
      color:#777;
      text-align:center;
    }

    @media (max-width: 640px){
      .confirm{ min-width: auto; }
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="title">KEEP 요청 (직원용)</div>
  </div>

  <div class="wrap">
    <div id="list" class="list"></div>
    <div id="empty" class="empty" style="display:none;">
      현재 KEEP 요청이 없습니다.
    </div>
  </div>

  <script>
    const ROOM_NO = 7;
    const POLL_MS = 1000;

    function esc(s){
      return (s ?? "").toString()
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function render(items){
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const arr = Array.isArray(items) ? items : [];

      if (!arr.length){
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      list.innerHTML = arr.map(k => {
        const imgHtml = k.product_image_url
          ? `<img src="${esc(k.product_image_url)}" alt="product" />`
          : `<span>이미지 없음</span>`;

        const name = k.product_name ?? "(상품 정보 없음)";
        const code = k.product_code ??
          (k.product_id != null ? String(k.product_id).padStart(3,"0") : "???");

        const isOpen = (k.status === "open");
        const btn = isOpen
          ? `<button class="confirm" onclick="ackKeep('${esc(k.id)}')">확인</button>`
          : `<button class="confirm" disabled>확인됨</button>`;

        return `
          <div class="card">
            <div class="thumb">${imgHtml}</div>
            <div class="col">
              <div class="room">피팅룸 ${ROOM_NO}번</div>
              <div class="name">${esc(name)}</div>
              <div class="code">옷 번호: <b>${esc(code)}</b></div>
            </div>
            <div class="actions">${btn}</div>
          </div>
        `;
      }).join("");
    }

    window.ackKeep = async function(id){
      try{
        await fetch(`/api/keeps/${encodeURIComponent(id)}/ack`, {
          method:"POST"
        });
      }catch(e){}
      await load();
    }

    async function load(){
      const res = await fetch("/api/keeps");
      const data = await res.json();
      render(data);
    }

    setInterval(load, POLL_MS);
    load();
  </script>
</body>
</html>
