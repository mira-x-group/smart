<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Smart Mirror - Select Screen (Vertical)</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/select.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/keep_sheet.css') }}">

  <!-- ✅ 캡쳐 사진을 "배경"으로 깔기 (칸 생성 X) -->
  <style>
    .mirror-container {
      background-image: linear-gradient(to bottom,
        rgba(2, 6, 23, 0.35),
        rgba(2, 6, 23, 0.55)),
      url("{{ url_for('static', filename='user.jpg') }}");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
  </style>
</head>

<body>
  <div class="mirror-frame">
    <div class="mirror-container">
      <div class="main-content">
        <div class="title-area">TODAY'S LOOK</div>
        <div class="subtitle">
          하단에서 룩을 선택해 오른쪽에 킵해 두고, 피팅 단계에서 하나씩 비교해 보세요.
        </div>
      </div>

      <!-- 썸네일 위 착용하기 버튼 -->
      <div class="strip-actions">
        <button class="btn-tryon" id="tryOnButton" type="button">착용하기</button>
      </div>

      <!-- 썸네일 2줄 × 4칸 -->
      <div class="clothes-strip" id="clothesStrip">
        <div class="cloth-item" data-name="LOOK 1">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">1</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 2">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">2</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 3">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">3</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 4">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">4</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 5">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">5</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 6">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">6</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 7">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">7</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
        <div class="cloth-item" data-name="LOOK 8">
          <div class="cloth-image-wrapper">
            <div class="cloth-number">8</div>
          </div>
          <button class="cloth-fav" type="button">♡</button>
        </div>
      </div>

      <div class="edge-handle" id="edgeHandle"></div>

      <div class="edge-panel" id="edgePanel">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <div class="panel-title">선택한 룩</div>
          </div>
          <div class="panel-header-right">
            <div class="panel-count" id="panelCount">0개</div>
            <button class="panel-close" id="panelCloseButton">‹</button>
          </div>
        </div>

        <div class="panel-list" id="panelList"></div>

        <div class="panel-footer">
          <button class="btn-keep" type="button">KEEP</button>
          <div class="keep-desc">가상피팅을 종료하고<br>직원이 제품을 준비해드립니다</div>
        </div>
      </div>



    </div>
  </div>

  <script src="{{ url_for('static', filename='js/keep_sheet.js') }}"></script>
  <script src="{{ url_for('static', filename='js/select.js') }}"></script>
  <!-- ✅ STT (Must be loaded after select.js) -->
  <script src="{{ url_for('static', filename='js/select_stt.js') }}"></script>

  <!-- ✅ 캐시 방지 -->
  <script>
    (function () {
      const container = document.querySelector(".mirror-container");
      if (!container) return;

      const base = "{{ url_for('static', filename='user.jpg') }}";
      container.style.backgroundImage =
        `linear-gradient(to bottom, rgba(2, 6, 23, 0.35), rgba(2, 6, 23, 0.55)),
         url("${base}?t=${Date.now()}")`;
    })();
  </script>
</body>

</html>
