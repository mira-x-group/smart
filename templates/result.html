<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mira X · 피팅 결과</title>

  <!-- Result 전용 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
  <!-- 킵시트 공용 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/keep_sheet.css') }}">
</head>

<body>
  <div class="mirror-frame">
    <div class="mirror-container">

      <!-- ✅ 중앙: 합성 결과 영역 -->
      <div class="screen-result" id="resultArea">
        <!-- ✅ 결과 이미지는 기존 영역에 표시 (새 칸 생성 X) -->
        <img id="resultImg" alt="피팅 결과" />
      </div>

      <!-- ✅ (Select 구조 그대로) 킵시트 핸들 -->
      <div class="edge-handle" id="edgeHandle"></div>

      <!-- ✅ (Select 구조 그대로) 킵시트 패널 -->
      <div class="edge-panel" id="edgePanel">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <div class="panel-title">선택한 룩</div>
          </div>
          <div class="panel-header-right">
            <div class="panel-count" id="panelCount">0개</div>
            <button class="panel-close" id="panelCloseButton" type="button">‹</button>
          </div>
        </div>

        <div class="panel-list" id="panelList"></div>

        <div class="panel-footer">
          <button class="btn-keep" type="button">KEEP</button>
          <div class="keep-desc">가상피팅을 종료하고<br>직원이 제품을 준비해드립니다</div>
        </div>
      </div>

      <!-- ✅ 하단: 셀렉으로 돌아가기 -->
      <div class="bottom-area">
        <button class="btn-back" id="btnBack" type="button">셀렉으로 돌아가기</button>
      </div>

    </div>
  </div>

  <!-- ✅ 킵시트 공용 JS (반드시 먼저) -->
  <script src="{{ url_for('static', filename='js/keep_sheet.js') }}"></script>
  <!-- ✅ Result 전용 JS -->
  <script src="{{ url_for('static', filename='js/result.js') }}"></script>
  <!-- ✅ STT (Must be loaded last) -->
  <script src="{{ url_for('static', filename='js/result_stt.js') }}"></script>
</body>

</html>
